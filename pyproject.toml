[project]
name = "aws-ingestion"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "mangum>=0.19",
  "boto3>=1.35",
  "pydantic>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "moto[sqs]>=5",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
