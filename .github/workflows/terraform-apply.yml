name: terraform-apply

# Manual by default so a push never creates billable resources by surprise.
# Set the repository variable AUTO_APPLY=true to also apply on every merge to main.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply or destroy"
        type: choice
        options: [apply, destroy]
        default: apply
  push:
    branches: [main]
    paths: ["infra/**", "src/**", "pyproject.toml", "uv.lock"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply   # never two applies at once
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_APPLY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Unit tests
        run: uv run pytest -q

      - name: Build Lambda packages
        run: |
          scripts/build_lambda.sh ingest
          scripts/build_lambda.sh consumer
          scripts/build_lambda.sh aggregate

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Init
        working-directory: infra
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false -backend-config="bucket=aws-ingestion-tfstate-${account}"

      - name: Apply or destroy
        working-directory: infra
        run: |
          action="${{ github.event.inputs.action || 'apply' }}"
          terraform "$action" -input=false -auto-approve
